<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181a20"/>
      <stop offset="100%" stop-color="#262932"/>
    </linearGradient>
    <linearGradient id="orange-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9d2b"/>
      <stop offset="100%" stop-color="#f2870d"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2870d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f2870d" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="550" cy="225" r="160" fill="url(#accent-grad)"/>

  <!-- Technical Circles / Donut Gauge Representation -->
  <circle cx="550" cy="225" r="130" stroke="#333842" stroke-width="8" stroke-dasharray="6 6"/>
  <circle cx="550" cy="225" r="100" stroke="#3d4350" stroke-width="14"/>
  <circle cx="550" cy="225" r="100" stroke="url(#orange-grad)" stroke-width="14" stroke-dasharray="450 628" stroke-linecap="round"/>

  <!-- Oil Droplet in Center -->
  <path d="M550 185 C550 185, 520 225, 520 245 C520 262, 533 275, 550 275 C567 275, 580 262, 580 245 C580 225, 550 185, 550 185 Z" fill="url(#orange-grad)" filter="url(#glow)"/>

  <!-- Left Content Illustration (CarBook Badge & Title Highlights) -->
  <g transform="translate(70, 110)">
    <!-- Badge -->
    <rect width="140" height="32" rx="16" fill="#2d2218" stroke="#f2870d" stroke-width="1.5"/>
    <text x="70" y="21" fill="#f2870d" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">سرویس‌های دوره‌ای</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">راهنمای تعویض</text>
    <text x="0" y="122" fill="#f2870d" font-family="system-ui, sans-serif" font-size="32" font-weight="900">روغن موتور خودرو</text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#a0a5b1" font-family="system-ui, sans-serif" font-size="15" font-weight="500">کیلومتر، زمان‌بندی و عوامل فرسودگی</text>

    <!-- Stat Pill -->
    <g transform="translate(0, 195)">
      <rect width="180" height="36" rx="8" fill="#1e222a" stroke="#363c48" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#27c93f"/>
      <text x="36" y="23" fill="#e2e4e9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">۵۰۰۰ تا ۸۰۰۰ کیلومتر</text>
    </g>
  </g>
</svg>
