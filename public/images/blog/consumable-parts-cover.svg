<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg-grad-2" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#191c24"/>
      <stop offset="100%" stop-color="#232732"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9d2b"/>
      <stop offset="100%" stop-color="#f2870d"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-2)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- Right Side: Graphic Representation of 4 Consumable Parts -->
  <g transform="translate(480, 80)">
    <!-- Card 1: Brake Pads -->
    <rect x="0" y="0" width="125" height="130" rx="14" fill="#20242e" stroke="#353b49" stroke-width="1.5"/>
    <circle cx="62" cy="45" r="24" fill="#2c2218"/>
    <path d="M50 45 C50 38 74 38 74 45 C74 52 50 52 50 45 Z" stroke="#f2870d" stroke-width="3" fill="none"/>
    <text x="62" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">لنت ترمز</text>
    <text x="62" y="112" fill="#27c93f" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">۸۰٪ سلامت</text>

    <!-- Card 2: Timing Belt -->
    <rect x="145" y="0" width="125" height="130" rx="14" fill="#20242e" stroke="#353b49" stroke-width="1.5"/>
    <circle cx="207" cy="45" r="24" fill="#1e293b"/>
    <circle cx="207" cy="45" r="16" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 3"/>
    <text x="207" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">تسمه تایم</text>
    <text x="207" y="112" fill="#ffbd2e" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">۴۵٪ سلامت</text>

    <!-- Card 3: Battery -->
    <rect x="0" y="150" width="125" height="130" rx="14" fill="#20242e" stroke="#353b49" stroke-width="1.5"/>
    <circle cx="62" cy="195" r="24" fill="#2a1e20"/>
    <rect x="52" y="185" width="20" height="20" rx="3" stroke="#f43f5e" stroke-width="2.5" fill="none"/>
    <line x1="58" y1="181" x2="58" y2="185" stroke="#f43f5e" stroke-width="2.5"/>
    <line x1="66" y1="181" x2="66" y2="185" stroke="#f43f5e" stroke-width="2.5"/>
    <text x="62" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">باتری</text>
    <text x="62" y="262" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">نیازمند بررسی</text>

    <!-- Card 4: Filter -->
    <rect x="145" y="150" width="125" height="130" rx="14" fill="#20242e" stroke="#353b49" stroke-width="1.5"/>
    <circle cx="207" cy="195" r="24" fill="#2c2218"/>
    <circle cx="207" cy="195" r="14" stroke="#f2870d" stroke-width="2.5"/>
    <line x1="207" y1="184" x2="207" y2="206" stroke="#f2870d" stroke-width="2"/>
    <line x1="196" y1="195" x2="218" y2="195" stroke="#f2870d" stroke-width="2"/>
    <text x="207" y="240" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">فیلتر هوا</text>
    <text x="207" y="262" fill="#27c93f" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">۹۰٪ سلامت</text>
  </g>

  <!-- Left Content Illustration -->
  <g transform="translate(70, 110)">
    <!-- Badge -->
    <rect width="110" height="32" rx="16" fill="#1e2738" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="55" y="21" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">راهنمای فنی</text>

    <!-- Main Title -->
    <text x="0" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="800">تشخیص زمان تعویض</text>
    <text x="0" y="122" fill="#f2870d" font-family="system-ui, sans-serif" font-size="32" font-weight="900">قطعات مصرفی خودرو</text>

    <!-- Subtitle -->
    <text x="0" y="165" fill="#a0a5b1" font-family="system-ui, sans-serif" font-size="15" font-weight="500">نشانه‌ها، جدول استهلاک و نگهداری پیشگیرانه</text>

    <!-- Stat Pill -->
    <g transform="translate(0, 195)">
      <rect width="210" height="36" rx="8" fill="#1e222a" stroke="#363c48" stroke-width="1"/>
      <circle cx="20" cy="18" r="5" fill="#f2870d"/>
      <text x="36" y="23" fill="#e2e4e9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">پایش هوشمند استهلاک در کاربوک</text>
    </g>
  </g>
</svg>
