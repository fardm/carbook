<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>صفحه پیدا نشد — CarBook</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f2870d" />

    <!-- Pre-paint Theme Script -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("carbook-landing-theme");
          if (!saved) {
            var stored = JSON.parse(localStorage.getItem("car-maintenance-tracker.dataset"));
            saved = stored && stored.settings && stored.settings.theme;
          }
          var dark =
            saved === "dark" ||
            (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.dataset.theme = "dark";
        } catch (e) {}
      })();
    </script>

    <!-- GitHub Pages SPA fallback only for valid non-trailing-slash directories and known blog articles -->
    <script>
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // /app without trailing slash -> redirect to /app/
        if (path === "/app" || path === "/app/") {
          window.location.replace("/app/" + search + hash);
          return;
        }

        // Public MPA routes without trailing slash on static hosts
        if (path === "/blog" || path === "/support" || path === "/privacy" || path === "/terms") {
          window.location.replace(path + "/" + search + hash);
          return;
        }

        // Known blog articles fallback for static hosting
        var KNOWN_SLUGS = [
          "when-to-change-engine-oil",
          "how-to-diagnose-consumable-parts"
        ];
        var blogMatch = path.match(/^\/blog\/([^/]+)\/?$/);
        if (blogMatch && blogMatch[1]) {
          var slug = decodeURIComponent(blogMatch[1]);
          if (KNOWN_SLUGS.indexOf(slug) !== -1) {
            var newSearch = search ? search + "&slug=" + encodeURIComponent(slug) : "?slug=" + encodeURIComponent(slug);
            window.location.replace("/blog/" + newSearch + hash);
            return;
          }
        }
      })();
    </script>

    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: url("/fonts/vazirmatn.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --color-bg: #f6f5f3;
        --color-card: #ffffff;
        --color-text: #1a1a1a;
        --color-text-muted: #5c5b59;
        --color-primary: #f2870d;
        --color-primary-hover: #d97405;
        --color-border: rgba(0, 0, 0, 0.08);
        --color-tag-bg: rgba(242, 135, 13, 0.12);
        --color-tag-text: #c46400;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }

      [data-theme="dark"] {
        --color-bg: #121212;
        --color-card: #1c1b1a;
        --color-text: #f0f0f0;
        --color-text-muted: #9e9c98;
        --color-primary: #f2870d;
        --color-primary-hover: #fa9b2e;
        --color-border: rgba(255, 255, 255, 0.08);
        --color-tag-bg: rgba(242, 135, 13, 0.18);
        --color-tag-text: #ff9d3b;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "Vazirmatn", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        direction: rtl;
        -webkit-font-smoothing: antialiased;
      }

      .header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--color-border);
      }

      .header__inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--color-text);
      }

      .brand__title {
        font-weight: 700;
        font-size: 1.25rem;
        display: block;
        line-height: 1.2;
      }

      .brand__subtitle {
        font-size: 0.8125rem;
        color: var(--color-text-muted);
        display: block;
        line-height: 1.2;
      }

      .main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
      }

      .card {
        background-color: var(--color-card);
        border: 1px solid var(--color-border);
        border-radius: 20px;
        padding: 48px 32px;
        max-width: 480px;
        width: 100%;
        text-align: center;
        box-shadow: var(--shadow);
      }

      .code-tag {
        display: inline-block;
        background: var(--color-tag-bg);
        color: var(--color-tag-text);
        font-weight: 700;
        font-size: 1.125rem;
        padding: 6px 16px;
        border-radius: 9999px;
        margin-bottom: 20px;
        letter-spacing: 1px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.875rem;
        font-weight: 800;
        line-height: 1.3;
        color: var(--color-text);
      }

      p {
        margin: 0 0 28px;
        color: var(--color-text-muted);
        font-size: 1rem;
        line-height: 1.6;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 28px;
        border-radius: 12px;
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: none;
        transition: background-color 0.2s ease, transform 0.1s ease;
      }

      .btn--primary {
        background-color: var(--color-primary);
        color: #ffffff;
      }

      .btn--primary:hover {
        background-color: var(--color-primary-hover);
        transform: translateY(-1px);
      }

      .btn--primary:active {
        transform: translateY(0);
      }

      .footer {
        padding: 24px;
        text-align: center;
        font-size: 0.8125rem;
        color: var(--color-text-muted);
        border-top: 1px solid var(--color-border);
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header__inner">
        <a href="/" class="brand" aria-label="کاربوک — صفحه اصلی">
          <img src="/favicon.svg" alt="" width="32" height="32" />
          <div>
            <span class="brand__title">کاربوک</span>
            <span class="brand__subtitle">دفترچه نگهداری خودرو</span>
          </div>
        </a>
      </div>
    </header>

    <main class="main">
      <div class="card">
        <div class="code-tag">خطای ۴۰۴</div>
        <h1>صفحه پیدا نشد</h1>
        <p>متأسفانه صفحه‌ای که به دنبال آن بودید پیدا نشد یا آدرس آن تغییر کرده است.</p>
        <a href="/" class="btn btn--primary">بازگشت به صفحه اصلی</a>
      </div>
    </main>

    <footer class="footer">
      <span>© ۲۰۲۶ کاربوک (CarBook). تمامی حقوق محفوظ است.</span>
    </footer>
  </body>
</html>
