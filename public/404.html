<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>صفحه یافت نشد — CarBook</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // /app without trailing slash -> redirect to /app/
        if (path === "/app" || path === "/app/") {
          window.location.replace("/app/" + search + hash);
          return;
        }

        // Public MPA routes without trailing slash on static hosts
        if (path === "/blog" || path === "/support" || path === "/privacy" || path === "/terms") {
          window.location.replace(path + "/" + search + hash);
          return;
        }

        // /blog/:slug -> redirect to /blog/?slug=... so blog/index.html can render it
        var blogMatch = path.match(/^\/blog\/([^/]+)/);
        if (blogMatch && blogMatch[1]) {
          var slug = blogMatch[1];
          var newSearch = search ? search + "&slug=" + slug : "?slug=" + slug;
          window.location.replace("/blog/" + newSearch + hash);
          return;
        }
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f6f5f3;
        color: #1a1a1a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #121212;
          color: #f0f0f0;
        }
      }
      a {
        color: #f2870d;
        text-decoration: none;
        font-weight: 500;
        margin: 0 8px;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>صفحه مورد نظر یافت نشد (۴۰۴)</h1>
    <p>
      <a href="/">صفحه اصلی</a>
      |
      <a href="/app">برنامه کاربوک</a>
      |
      <a href="/blog">وبلاگ</a>
    </p>
  </body>
</html>
