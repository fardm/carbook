<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CarBook — Blog</title>
    <meta name="description" content="وبلاگ کاربوک — مقالات و نکات نگهداری خودرو" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      :root {
        --bg: #f6f5f3;
        --text: #1a1a1a;
        --primary: #f2870d;
        --border: #e0deda;
        --card-bg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121212;
          --text: #f0f0f0;
          --border: #2a2a2a;
          --card-bg: #1e1e1e;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .container {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px 32px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      }
      h1 {
        margin: 0 0 16px;
        font-size: 1.75rem;
      }
      p {
        margin: 0 0 24px;
        color: #888;
        font-size: 0.95rem;
      }
      code {
        background: rgba(125, 125, 125, 0.15);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.9em;
      }
      .sample-links a {
        color: var(--primary);
        text-decoration: none;
      }
      .sample-links a:hover {
        text-decoration: underline;
      }
      .nav-links {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        transition: opacity 0.2s ease;
      }
      .btn--primary {
        background-color: var(--primary);
        color: #ffffff;
      }
      .btn--secondary {
        background-color: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
      .btn:hover {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div id="blog-app">
      <div class="container">
        <h1>CarBook — Blog</h1>
        <p>در حال بارگذاری وبلاگ...</p>
      </div>
    </div>
    <script type="module" src="/src/blog.ts"></script>
  </body>
</html>
